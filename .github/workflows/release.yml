name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for build verification (no publication)'
        default: v0.1.4
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
jobs:
  java:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and package Java Agent
        run: mvn -B -f java-agent/pom.xml verify
      - uses: actions/upload-artifact@v4
        with:
          name: internal-java-agent
          path: java-agent/target/traffic-java-agent.jar
          if-no-files-found: error

  linux:
    needs: java
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: internal-java-agent
          path: java-agent/target
      - name: Install native build tools
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev clang llvm libelf-dev libssl-dev zlib1g-dev flex bison linux-tools-common linux-tools-generic
      - name: Test source and build pinned offline dependencies
        run: |
          go test -race ./...
          go vet ./...
          export PATH="$(dirname "$(find /usr/lib/linux-tools -name bpftool -type f | head -n 1)"):$PATH"
          bash scripts/build-ecapture.sh "$RUNNER_TEMP/ecapture"
          bash scripts/build-portable-linux.sh "$RUNNER_TEMP/ecapture"
          bash scripts/test-openssl-preload.sh
      - name: Package collector and console separately for each distro
        run: |
          for distro in ubuntu centos7; do
            for component in traffic traffic-console; do
              python3 scripts/package-release.py --version "$RELEASE_VERSION" --platform "$distro-${{ matrix.arch }}" --component "$component"
            done
          done
      - name: Smoke test packages in clean Ubuntu and CentOS 7
        run: |
          bash scripts/smoke-linux-release.sh "$RELEASE_VERSION" '${{ matrix.arch }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-linux-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  windows:
    needs: java
    runs-on: windows-2022
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: internal-java-agent
          path: java-agent/target
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Configure CGO
        shell: pwsh
        run: |
          $root = '${{ steps.msys2.outputs.msys2-location }}'
          "CC=$root\mingw64\bin\gcc.exe" >> $env:GITHUB_ENV
          "$root\mingw64\bin" >> $env:GITHUB_PATH
      - name: Test and build
        shell: pwsh
        run: |
          go test -race ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force bin | Out-Null
          foreach ($component in @('traffic', 'traffic-console')) {
            go build -trimpath -ldflags="-s -w -linkmode external -extldflags '-static'" -o "bin/$component.exe" "./cmd/$component"
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Bundle all Windows dependencies and split components
        shell: pwsh
        run: |
          python scripts/package-windows-deps.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($component in @('traffic', 'traffic-console')) {
            python scripts/package-release.py --version "$env:RELEASE_VERSION" --platform windows-amd64 --component $component
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
      - name: Verify extracted package without Npcap or system Python
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'traffic portable test'
          New-Item -ItemType Directory -Force $root | Out-Null
          foreach ($component in @('traffic', 'traffic-console')) {
            Expand-Archive "dist/$component-$env:RELEASE_VERSION-windows-amd64.zip" $root
          }
          ./scripts/windows/smoke-release.ps1 -App "$root/traffic-$env:RELEASE_VERSION-windows-amd64" -Console "$root/traffic-console-$env:RELEASE_VERSION-windows-amd64"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-windows-amd64
          path: dist/*.zip
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Verify and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f "docs/releases/$RELEASE_VERSION.md"
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 10
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)
          gh release create "$RELEASE_VERSION" dist/* \
            --verify-tag --draft --title "traffic $RELEASE_VERSION" \
            --notes-file "docs/releases/$RELEASE_VERSION.md"
          gh release edit "$RELEASE_VERSION" --draft=false --latest
