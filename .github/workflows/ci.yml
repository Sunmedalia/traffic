name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install capture headers
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - name: Race tests
        run: go test -race ./...
      - name: Static checks
        run: go vet ./...
      - name: Build
        run: |
          go build -o bin/traffic ./cmd/traffic
          go build -o bin/traffic-console ./cmd/traffic-console
          bash scripts/build-openssl-preload.sh
          bash scripts/test-openssl-preload.sh
      - name: Check validation scripts
        run: |
          python3 -m py_compile scripts/*.py scripts/linux/*.py scripts/windows/*.py
          python3 -m unittest discover -s scripts -p 'test_*.py'
          node scripts/windows/test-iis-plaintext.js
          node scripts/web/test-decoder.cjs
          bash -n scripts/*.sh

  ecapture-patches:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install capture headers
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Apply pinned patches and test output budgets
        run: bash scripts/test-ecapture-patches.sh "$RUNNER_TEMP/ecapture-patch-tests"

  java-agent:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Test and package Java Agent
        run: mvn -B -f java-agent/pom.xml verify

  windows:
    runs-on: windows-2022
    env:
      CGO_ENABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
      - name: Configure CGO
        shell: pwsh
        run: |
          $root = '${{ steps.msys2.outputs.msys2-location }}'
          "CC=$root\mingw64\bin\gcc.exe" >> $env:GITHUB_ENV
          "$root\mingw64\bin" >> $env:GITHUB_PATH
      - name: Windows native race tests
        run: go test -race ./...
      - name: Windows static checks
        run: go vet ./...
      - name: Windows builds
        run: |
          go build -o bin/traffic.exe ./cmd/traffic
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go build -o bin/traffic-console.exe ./cmd/traffic-console
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
